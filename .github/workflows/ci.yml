name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: E-commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Tests run against in-memory H2 (src/test/resources/application.properties); no secrets required
      - run: mvn -B test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: E-commerce/target/surefire-reports

  admin-frontend:
    name: Admin app (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  storefront:
    name: Storefront (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-official
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-official/package-lock.json
      - run: npm ci
      - run: npx quasar build
