# === Production Environment Configuration ===
# 生產環境專用配置

# === JPA - 生產模式 ===
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# === Logging - 最小日誌 ===
logging.level.root=WARN
logging.level.com.info.ecommerce=INFO
logging.level.org.springframework.security=WARN

# === 生產環境使用正式金流 ===
payment.linepay.sandbox=false
payment.linepay.api-url=${LINEPAY_API_URL:https://api-pay.line.me}

payment.ecpay.sandbox=false
payment.ecpay.api-url=${ECPAY_API_URL:https://payment.ecpay.com.tw}

# === 安全性增強 ===
server.error.include-stacktrace=never
server.error.include-message=never

# === Required in production (no defaults: startup fails if missing) ===
jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}
payment.ecpay.merchant-id=${ECPAY_MERCHANT_ID}
payment.ecpay.hash-key=${ECPAY_HASH_KEY}
payment.ecpay.hash-iv=${ECPAY_HASH_IV}
payment.ecpay.return-url=${ECPAY_RETURN_URL}
payment.ecpay.notify-url=${ECPAY_NOTIFY_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.storefront-url=${STOREFRONT_URL}
app.bootstrap.demo-users=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
