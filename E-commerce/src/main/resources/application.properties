spring.application.name=E-commerce
server.port=${SERVER_PORT:8080}

# =====================================================================
# All secrets and environment-specific values come from environment
# variables. See docs/deployment-guide.md (section "Environment variables")
# and E-commerce/.env.example. Never commit real credentials here.
# =====================================================================

# --- Database (SQL Server) ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;DatabaseName=e-commerce;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# --- JWT ---
# Base64 key of at least 32 bytes: `openssl rand -base64 32`.
# If unset, a temporary random key is used (tokens become invalid on restart).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- Initial admin account (created only when the user table is empty) ---
# If ADMIN_INITIAL_PASSWORD is unset a random password is generated and logged once.
app.bootstrap.admin-username=${ADMIN_INITIAL_USERNAME:admin}
app.bootstrap.admin-email=${ADMIN_INITIAL_EMAIL:admin@example.com}
app.bootstrap.admin-password=${ADMIN_INITIAL_PASSWORD:}
# Creates manager/staff/customer demo accounts with well-known passwords. Dev only.
app.bootstrap.demo-users=${DEMO_USERS:false}

# --- Google sign-in: OAuth client ID (same value as the admin app's VITE_GOOGLE_CLIENT_ID). Empty = disabled ---
app.google.client-id=${GOOGLE_CLIENT_ID:}

# --- CORS / front-end URLs ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
# Storefront (frontend-official) public URL, used for payment return pages
app.storefront-url=${STOREFRONT_URL:http://localhost:5174}

# --- Customer emails (order placed / paid / cancelled) ---
# Enabled only when an SMTP host is configured via SPRING_MAIL_HOST (+ SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). Do not set spring.mail.host here: an empty value would
# still create a mail sender.
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:}
# Default is 遇日小舖 (unicode-escaped: .properties files are read as ISO-8859-1)
app.mail.store-name=${STORE_NAME:\u9047\u65e5\u5c0f\u8216}
app.mail.order-notifications=${ORDER_EMAILS_ENABLED:true}

# --- Orders ---
# Unpaid online-payment (ECPay) storefront orders are cancelled and their stock released after this many hours (0 = never)
app.order.unpaid-timeout-hours=${ORDER_UNPAID_TIMEOUT_HOURS:72}

# --- File upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
# multipart request overhead (boundary / metadata) needs extra buffer beyond 10MB file size
spring.servlet.multipart.max-request-size=12MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads/images}

# --- Response compression ---
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# --- LINE Pay ---
payment.linepay.channel-id=${LINEPAY_CHANNEL_ID:}
payment.linepay.channel-secret-key=${LINEPAY_CHANNEL_SECRET:}
payment.linepay.api-url=${LINEPAY_API_URL:https://sandbox-api-pay.line.me}
payment.linepay.confirm-url=${LINEPAY_CONFIRM_URL:http://localhost:8080/api/payment-gateway/callback/linepay/confirm}
payment.linepay.cancel-url=${LINEPAY_CANCEL_URL:http://localhost:8080/api/payment-gateway/callback/linepay/cancel}
payment.linepay.sandbox=${LINEPAY_SANDBOX:true}

# --- ECPay ---
# Defaults are ECPay's public stage (sandbox) test merchant; set real values in production.
payment.ecpay.merchant-id=${ECPAY_MERCHANT_ID:2000132}
payment.ecpay.hash-key=${ECPAY_HASH_KEY:5294y06JbISpM5x9}
payment.ecpay.hash-iv=${ECPAY_HASH_IV:v77hoKGq4kWxNNIS}
payment.ecpay.api-url=${ECPAY_API_URL:https://payment-stage.ecpay.com.tw}
# Browser "back to store" URL after paying (admin app default; storefront orders override it per order)
payment.ecpay.return-url=${ECPAY_RETURN_URL:http://localhost:5173/payment/result}
# Server-to-server payment notification URL; must be publicly reachable by ECPay
payment.ecpay.notify-url=${ECPAY_NOTIFY_URL:http://localhost:8080/api/payment-gateway/callback/ecpay}
payment.ecpay.sandbox=${ECPAY_SANDBOX:true}
